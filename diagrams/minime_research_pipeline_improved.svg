<svg width="100%" viewBox="0 0 900 710" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Research pipeline diagram</title>
  <desc>Research pipeline from Instagram direct messages through JSONL dataset preparation, LoRA fine-tuning, evaluation, and LoRA adapter output.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f6f9fd; }
      .header { fill: #12233f; }
      .panel { fill: #ffffff; stroke: #c7d5e8; stroke-width: 1.4; }
      .box { stroke-width: 1.6; filter: url(#shadow); }
      .data { fill: #e8f8ef; stroke: #059669; }
      .prep { fill: #eef5ff; stroke: #2563eb; }
      .jsonl { fill: #f7efff; stroke: #7c3aed; }
      .split { fill: #fff0f4; stroke: #e11d48; }
      .model { fill: #eef5ff; stroke: #2563eb; }
      .lora { fill: #f7efff; stroke: #7c3aed; }
      .eval { fill: #fff8e6; stroke: #d97706; }
      .out { fill: #e8f8ef; stroke: #059669; }
      .artifact { fill: #ffffff; stroke: #c7d5e8; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .softline { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .h1 { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .phase { font: 700 14px "Segoe UI", Arial, sans-serif; }
      .phase-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .body { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .title { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .sub { font: 400 11px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .label { font: 400 10.5px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .badgeText { font: 700 11px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="900" height="710"/>

  <rect x="38" y="26" width="824" height="78" rx="14" class="header" filter="url(#shadow)"/>
  <text x="450" y="58" text-anchor="middle" class="h1">Research Pipeline</text>
  <text x="450" y="82" text-anchor="middle" class="subtitle">From Instagram Direct Messages to LoRA Adapter Output</text>

  <rect x="38" y="134" width="824" height="220" rx="16" class="panel" filter="url(#shadow)"/>
  <rect x="38" y="378" width="824" height="170" rx="16" class="panel" filter="url(#shadow)"/>
  <rect x="38" y="572" width="824" height="94" rx="16" class="panel" filter="url(#shadow)"/>

  <text x="64" y="170" class="phase" fill="#2563eb">Phase 1</text>
  <text x="64" y="196" class="phase-title">Data Preparation</text>
  <text x="64" y="222" class="body">Clean raw chats, build sessions,</text>
  <text x="64" y="238" class="body">tag style signals, and prepare</text>
  <text x="64" y="254" class="body">train/validation JSONL files.</text>

  <text x="64" y="414" class="phase" fill="#7c3aed">Phase 2</text>
  <text x="64" y="440" class="phase-title">Model Adaptation</text>
  <text x="64" y="466" class="body">Fine-tune with LoRA using</text>
  <text x="64" y="482" class="body">dataset + base model.</text>

  <text x="64" y="604" class="phase" fill="#ea580c">Phase 3</text>
  <text x="64" y="630" class="phase-title">Evaluation &amp; Output</text>
  <text x="64" y="650" class="body">Evaluate performance and save the</text>
  <text x="64" y="666" class="body">trained LoRA adapter artifact.</text>

  <!-- Phase 1 steps -->
  <g transform="translate(230 160)">
    <rect width="118" height="58" rx="12" class="box data"/>
    <circle cx="22" cy="29" r="14" fill="#059669"/>
    <text x="22" y="33" text-anchor="middle" class="badgeText">1</text>
    <text x="75" y="25" text-anchor="middle" class="title">IG DM</text>
    <text x="75" y="43" text-anchor="middle" class="title">Export</text>
  </g>
  <line x1="348" y1="189" x2="377" y2="189" class="line"/>

  <g transform="translate(382 160)">
    <rect width="118" height="58" rx="12" class="box prep"/>
    <circle cx="22" cy="29" r="14" fill="#2563eb"/>
    <text x="22" y="33" text-anchor="middle" class="badgeText">2</text>
    <text x="76" y="25" text-anchor="middle" class="title">Clean &amp;</text>
    <text x="76" y="43" text-anchor="middle" class="title">Filter</text>
  </g>
  <line x1="500" y1="189" x2="529" y2="189" class="line"/>

  <g transform="translate(534 160)">
    <rect width="118" height="58" rx="12" class="box prep"/>
    <circle cx="22" cy="29" r="14" fill="#d97706"/>
    <text x="22" y="33" text-anchor="middle" class="badgeText">3</text>
    <text x="76" y="25" text-anchor="middle" class="title">Build Chat</text>
    <text x="76" y="43" text-anchor="middle" class="title">Sessions</text>
  </g>
  <line x1="652" y1="189" x2="681" y2="189" class="line"/>

  <g transform="translate(686 160)">
    <rect width="118" height="58" rx="12" class="box jsonl"/>
    <circle cx="22" cy="29" r="14" fill="#7c3aed"/>
    <text x="22" y="33" text-anchor="middle" class="badgeText">4</text>
    <text x="76" y="25" text-anchor="middle" class="title">Tagged</text>
    <text x="76" y="43" text-anchor="middle" class="title">JSONL</text>
  </g>

  <line x1="745" y1="218" x2="745" y2="244" class="line"/>

  <g transform="translate(686 250)">
    <rect width="118" height="58" rx="12" class="box split"/>
    <circle cx="22" cy="29" r="14" fill="#e11d48"/>
    <text x="22" y="33" text-anchor="middle" class="badgeText">5</text>
    <text x="76" y="25" text-anchor="middle" class="title">Train/Val</text>
    <text x="76" y="43" text-anchor="middle" class="title">Split</text>
  </g>

  <line x1="686" y1="279" x2="583" y2="279" class="line"/>
  <text x="631" y="269" text-anchor="middle" class="label">writes files</text>

  <g transform="translate(410 250)">
    <rect width="170" height="58" rx="12" class="box artifact"/>
    <text x="85" y="25" text-anchor="middle" class="title">Phase 1 Output</text>
    <text x="85" y="43" text-anchor="middle" class="sub">train.jsonl + val.jsonl</text>
  </g>

  <!-- Phase 2 -->
  <line x1="495" y1="308" x2="495" y2="388" class="line"/>
  <text x="536" y="352" class="label">dataset files</text>

  <g transform="translate(410 392)">
    <rect width="170" height="58" rx="12" class="box artifact"/>
    <text x="85" y="25" text-anchor="middle" class="title">Prepared Dataset</text>
    <text x="85" y="43" text-anchor="middle" class="sub">train.jsonl + val.jsonl</text>
  </g>

  <line x1="495" y1="450" x2="495" y2="470" class="line"/>
  <text x="535" y="462" class="label">dataset input</text>

  <g transform="translate(410 476)">
    <rect width="340" height="54" rx="12" class="box lora"/>
    <circle cx="25" cy="27" r="14" fill="#7c3aed"/>
    <text x="25" y="31" text-anchor="middle" class="badgeText">7</text>
    <text x="184" y="23" text-anchor="middle" class="title">LoRA Fine-tuning</text>
    <text x="184" y="39" text-anchor="middle" class="sub">Unsloth + Typhoon2-Qwen2.5-7B-Instruct</text>
  </g>

  <g transform="translate(238 476)">
    <rect width="150" height="54" rx="12" class="box model"/>
    <circle cx="22" cy="27" r="14" fill="#2563eb"/>
    <text x="22" y="31" text-anchor="middle" class="badgeText">6</text>
    <text x="88" y="23" text-anchor="middle" class="title">Base Model</text>
    <text x="88" y="39" text-anchor="middle" class="sub">Typhoon2 7B</text>
  </g>
  <line x1="388" y1="503" x2="403" y2="503" class="line"/>

  <!-- Phase 3 -->
  <line x1="495" y1="530" x2="495" y2="586" class="line"/>
  <text x="535" y="560" class="label">trained adapter</text>

  <g transform="translate(410 590)">
    <rect width="170" height="56" rx="12" class="box eval"/>
    <circle cx="23" cy="28" r="14" fill="#d97706"/>
    <text x="23" y="32" text-anchor="middle" class="badgeText">8</text>
    <text x="100" y="24" text-anchor="middle" class="title">Performance</text>
    <text x="100" y="42" text-anchor="middle" class="title">Evaluation</text>
  </g>

  <line x1="580" y1="618" x2="625" y2="618" class="line"/>

  <g transform="translate(630 590)">
    <rect width="168" height="56" rx="12" class="box out"/>
    <circle cx="23" cy="28" r="14" fill="#059669"/>
    <text x="23" y="32" text-anchor="middle" class="badgeText">9</text>
    <text x="101" y="24" text-anchor="middle" class="title">LoRA Adapter</text>
    <text x="101" y="42" text-anchor="middle" class="title">Output</text>
  </g>

  <text x="450" y="695" text-anchor="middle" class="label">Figure: Research pipeline for preparing Instagram DM conversations and fine-tuning a Thai conversational language model.</text>
</svg>
